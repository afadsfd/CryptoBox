name: frontend
description: CryptoBox - Asset Aggregation App
publish_to: 'none'
version: 1.3.1+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^0.69.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.3
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.1
  path: ^1.8.3
  crypto: ^3.0.6
  shared_preferences: ^2.2.2
  http: ^1.1.0
  encrypt: ^5.0.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  drift_dev: ^2.14.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: assets/branding/app_icon.png
  # 默认 16% 内边距会让图标变小并露出背景，易产生「黑圈」观感
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
